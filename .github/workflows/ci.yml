# Verify the book: the build is reproducible, and the listings of both
# locales pass parsing, ruff, and mypy on a matrix of Python versions.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        include:
          - python: "3.15"
            prerelease: true
    continue-on-error: ${{ matrix.prerelease || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Check dependencies
        run: pip install -r requirements-check.txt

      - name: The build is reproducible
        run: |
          ./build.sh
          git diff --exit-code rag-python-advanced.html

      - name: Listings of both locales
        run: ./check_examples.sh
