# Проверка пособия: сборка воспроизводима, листинги обеих локалей
# проходят разбор, ruff и mypy на матрице версий Python.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        include:
          - python: "3.15"
            prerelease: true
    continue-on-error: ${{ matrix.prerelease || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Зависимости проверок
        run: pip install -r requirements-check.txt

      - name: Сборка воспроизводима
        run: |
          ./build.sh
          git diff --exit-code rag-python-advanced.html

      - name: Листинги обеих локалей
        run: ./check_examples.sh
